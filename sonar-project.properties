# SonarCloud/SonarQube Configuration
# For SonarCloud: https://sonarcloud.io
# For SonarQube: Your self-hosted instance

# Project identification
sonar.projectKey=node-mono-repo-template

# Project metadata
sonar.projectName=Node Mono Repo Template
sonar.projectVersion=1.0.0

# Source code location — apps/backend/* and common/* are C# (.NET 10) now,
# apps/frontend/* and apps/mobile/* stay TypeScript. This CLI-based scanner
# does text/pattern analysis on the C# sources (sonar.sources below), not the
# deeper semantic analysis the MSBuild-integrated `dotnet-sonarscanner` gives —
# see continuous-integration.yml's sonarcloud job comment for why that scanner
# isn't wired up yet (no apps/backend/*/tests projects exist in this repo yet).
sonar.sources=apps,common
sonar.tests=apps,common

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/bin/**,\
  **/obj/**,\
  **/coverage/**,\
  **/.turbo/**,\
  **/.next/**,\
  **/public/**,\
  **/*.config.js,\
  **/*.config.mjs,\
  **/*.config.ts,\
  **/jest.preset.js,\
  **/*.d.ts,\
  **/migrations/**,\
  **/generated/**

# Test exclusions
sonar.test.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/bin/**,\
  **/obj/**,\
  **/*.config.*

# Test inclusions
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.spec.ts,\
  **/tests/**/*.ts,\
  **/tests/**/*.cs

# Coverage — frontend (jest lcov) is wired; backend has no coverage report
# path yet because no apps/backend/*/tests project exists in this repo yet.
# Once xUnit + coverlet.collector land, add the resulting cobertura/opencover
# report path via sonar.cs.opencover.reportsPaths (requires the MSBuild
# scanner wrapper, not this CLI scanner — see the note above sonar.sources).
sonar.javascript.lcov.reportPaths=\
  apps/frontend/admin-web/coverage/lcov.info,\
  apps/frontend/customer-web/coverage/lcov.info,\
  apps/mobile/customer-mobile/coverage/lcov.info

# TypeScript configuration — frontend/mobile only
sonar.typescript.tsconfigPaths=\
  apps/frontend/admin-web/tsconfig.json,\
  apps/frontend/customer-web/tsconfig.json,\
  apps/mobile/customer-mobile/tsconfig.json

# Encoding
sonar.sourceEncoding=UTF-8

# Quality gates - customize thresholds
sonar.qualitygate.wait=true

# Monorepo module configuration (optional - for separate dashboards per service)
# Uncomment and configure if you want separate analysis per module
# sonar.modules=api-gateway,customer-api,admin-api,schedule-api

# api-gateway.sonar.projectName=API Gateway
# api-gateway.sonar.sources=apps/backend/api-gateway/src
# api-gateway.sonar.tests=apps/backend/api-gateway/tests

# customer-api.sonar.projectName=Customer API
# customer-api.sonar.sources=apps/backend/customer-api/src
# customer-api.sonar.tests=apps/backend/customer-api/tests

