services:
    nginx:
        build:
            context: ../../infrastructure/nginx
            dockerfile: Dockerfile
        container_name: nginx-proxy
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ../../infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ../../infrastructure/nginx/development.conf:/etc/nginx/conf.d/default.conf:ro
            - nginx_cache:/var/cache/nginx
            - certbot_www:/var/www/certbot:ro
            - certbot_conf:/etc/nginx/ssl:ro
        networks:
            - app-network
        depends_on:
            api-gateway:
                condition: service_healthy
            customer-web:
                condition: service_started
            admin-web:
                condition: service_started
        restart: unless-stopped

    api-gateway:
        build:
            context: ../../
            dockerfile: apps/backend/api-gateway/Dockerfile
        container_name: api-gateway
        expose:
            - "4000"
        environment:
            - NODE_ENV=production
            - DOTNET_ENVIRONMENT=Production
            - PORT=4000
            - CORS_ORIGIN=${CORS_ORIGIN}
            - CUSTOMER_API_URL=http://customer-api:4002
            - ADMIN_API_URL=http://admin-api:4001
            - SCHEDULER_API_URL=http://schedule-api:4003
            - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-200}
        networks:
            - app-network
        depends_on:
            customer-api:
                condition: service_healthy
            admin-api:
                condition: service_healthy
            schedule-api:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
        restart: unless-stopped

    customer-api:
        build:
            context: ../../
            dockerfile: apps/backend/customer-api/Dockerfile
        container_name: customer-api
        expose:
            - "4002"
        environment:
            - NODE_ENV=production
            - DOTNET_ENVIRONMENT=Production
            - PORT=4002
            - DATABASE_URL=${DATABASE_URL}
            - JWT_SECRET=${CUSTOMER_JWT_SECRET}
            - JWT_REFRESH_SECRET=${CUSTOMER_JWT_REFRESH_SECRET}
            - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
            - CORS_ORIGIN=${CORS_ORIGIN}
            - CUSTOMER_WEB_URL=${CUSTOMER_WEB_URL}
        networks:
            - app-network
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4002/api/v1/ping || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
        restart: unless-stopped

    admin-api:
        build:
            context: ../../
            dockerfile: apps/backend/admin-api/Dockerfile
        container_name: admin-api
        expose:
            - "4001"
        environment:
            - NODE_ENV=production
            - DOTNET_ENVIRONMENT=Production
            - PORT=4001
            - DATABASE_URL=${DATABASE_URL}
            - JWT_SECRET=${ADMIN_JWT_SECRET}
            - JWT_REFRESH_SECRET=${ADMIN_JWT_REFRESH_SECRET}
            - MFA_CHALLENGE_SECRET=${ADMIN_MFA_CHALLENGE_SECRET}
            - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
            - CORS_ORIGIN=${CORS_ORIGIN}
            - ADMIN_WEB_URL=${ADMIN_WEB_URL}
            - PASSWORD_RESET_EXPIRATION_MINUTES=${PASSWORD_RESET_EXPIRATION_MINUTES:-60}
            - TWO_FACTOR_ENCRYPTION_KEY=${TWO_FACTOR_ENCRYPTION_KEY}
        networks:
            - app-network
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4001/api/v1/ping || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
        restart: unless-stopped

    schedule-api:
        build:
            context: ../../
            dockerfile: apps/backend/schedule-api/Dockerfile
        container_name: schedule-api
        expose:
            - "4003"
        environment:
            - NODE_ENV=production
            - DOTNET_ENVIRONMENT=Production
            - PORT=4003
            - DATABASE_URL=${DATABASE_URL}
            - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
            - SCHEDULE_API_KEY=${SCHEDULE_API_KEY}
            - CORS_ORIGIN=${CORS_ORIGIN}
        networks:
            - app-network
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4003/api/v1/ping || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
        restart: unless-stopped

    customer-web:
        build:
            context: ../../
            dockerfile: apps/frontend/customer-web/Dockerfile
        container_name: customer-web
        expose:
            - "3000"
        networks:
            - app-network
        restart: unless-stopped

    admin-web:
        build:
            context: ../../
            dockerfile: apps/frontend/admin-web/Dockerfile
        container_name: admin-web
        expose:
            - "80"
        networks:
            - app-network
        restart: unless-stopped

    postgres:
        image: postgres:16-alpine
        container_name: postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - app-network
        expose:
            - "5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    redis:
        image: redis:7-alpine
        container_name: redis
        restart: unless-stopped
        command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
        networks:
            - app-network
        expose:
            - "6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    certbot:
        image: certbot/certbot
        container_name: certbot
        volumes:
            - certbot_www:/var/www/certbot
            - certbot_conf:/etc/letsencrypt
        entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
    app-network:
        driver: bridge

volumes:
    postgres_data:
    redis_data:
    nginx_cache:
    certbot_www:
    certbot_conf:
