name: Security Scan

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        - cron: "0 6 * * 1"

permissions:
    contents: read
    actions: read
    security-events: write

jobs:
    dependency-audit-frontend:
        name: Dependency Audit (pnpm)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run pnpm audit
              run: pnpm audit --audit-level=high
              continue-on-error: true

    dependency-audit-backend:
        name: Dependency Audit (NuGet)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"

            - name: Restore
              run: dotnet restore DotNetMonoRepoTemplate.sln

            - name: List vulnerable NuGet packages
              run: dotnet list DotNetMonoRepoTemplate.sln package --vulnerable --include-transitive
              continue-on-error: true

    codeql:
        name: CodeQL Analysis (${{ matrix.language }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - language: javascript-typescript
                      build-mode: none
                    - language: csharp
                      build-mode: autobuild
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup .NET
              if: matrix.language == 'csharp'
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v3
              with:
                  languages: ${{ matrix.language }}
                  build-mode: ${{ matrix.build-mode }}
                  queries: security-and-quality

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v3
              with:
                  category: "/language:${{ matrix.language }}"
                  upload: never
                  output: codeql-results

            - name: Upload SARIF results as artifact
              uses: actions/upload-artifact@v4
              with:
                  name: codeql-sarif-${{ matrix.language }}
                  path: codeql-results
                  retention-days: 30

            - name: Fail on high severity findings
              run: |
                  SARIF_FILE=$(find codeql-results -name "*.sarif" | head -n1)
                  COUNT=$(jq '[.runs[].results[] | select(.level == "error")] | length' "$SARIF_FILE")
                  echo "High severity findings: $COUNT"
                  if [ "$COUNT" -gt 0 ]; then
                    jq -r '.runs[].results[] | select(.level == "error") | "\(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' "$SARIF_FILE"
                    exit 1
                  fi

    secrets-scan:
        name: Secrets Scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: TruffleHog OSS Scan (PR diff)
              if: github.event_name == 'pull_request'
              uses: trufflesecurity/trufflehog@main
              with:
                  path: ./
                  base: ${{ github.event.pull_request.base.sha }}
                  head: ${{ github.event.pull_request.head.sha }}
                  extra_args: --only-verified

            - name: TruffleHog OSS Scan (full history)
              if: github.event_name != 'pull_request'
              uses: trufflesecurity/trufflehog@main
              with:
                  path: ./
                  extra_args: --only-verified
